[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ansys-common-mcp-token-meter"
version = "0.1.0"
description = "Token counting and budget enforcement for FastMCP-based MCP servers"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["fastmcp>=2.0"]

[project.optional-dependencies]
tiktoken = ["tiktoken>=0.7.0"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-mock",
    "ruff>=0.4",
    "pre-commit",
    "tiktoken>=0.7.0",
]

[project.entry-points."pytest11"]
ansys_mcp_token_meter = "ansys.common.mcp.token_meter.pytest_plugin"

[project.scripts]
mcp-token-meter = "ansys.common.mcp.token_meter.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ansys"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
